[package]
name = "litebox_platform_windows_userland"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/microsoft/litebox"
description = "A LiteBox platform for running LiteBox on userland Windows"

[target.'cfg(windows)'.dependencies]
getrandom = "0.3.4"
litebox = { path = "../litebox/", version = "0.1.0" }
litebox_common_linux = { path = "../litebox_common_linux", version = "0.1.0" }

windows-sys = { version = "0.60.2", features = [
    "Win32_System_Console",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Kernel",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_WindowsProgramming",
] }
zerocopy = { version = "0.8", default-features = false }

[lints]
clippy.pedantic = { level = "warn", priority = -1 }
clippy.unreadable_literal = "allow"
clippy.doc_markdown = "allow"
clippy.missing_errors_doc = "allow"
clippy.needless_pass_by_value = "allow"
clippy.redundant_else = "allow"
clippy.must_use_candidate = "allow"
clippy.too_many_lines = "allow"
