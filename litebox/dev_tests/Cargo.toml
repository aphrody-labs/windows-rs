[package]
name = "dev_tests"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/microsoft/litebox"
description = "Repository-wide development tests for LiteBox"
publish = false

# All dependencies here are dev dependencies, because this is just purely tests.
[dev-dependencies]
anyhow = "1.0.99"
fs-err = "3.1.2"

[lints]
clippy.pedantic = { level = "warn", priority = -1 }
clippy.unreadable_literal = "allow"
clippy.doc_markdown = "allow"
clippy.missing_errors_doc = "allow"
clippy.needless_pass_by_value = "allow"
clippy.redundant_else = "allow"
clippy.must_use_candidate = "allow"
clippy.too_many_lines = "allow"

[dependencies]
ignore = "0.4.25"
