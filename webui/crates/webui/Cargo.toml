[package]
name = "microsoft-webui"
description = "Programmatic API for the WebUI build-time rendering framework"
version = "3.1.1"
edition = "2021"
rust-version = "1.99.1"
authors = ["Microsoft Edge"]
license = "MIT"
repository = "https://github.com/microsoft/webui"
homepage = "https://microsoft.github.io/webui"
readme = "README.md"
keywords = ["webui", "ssr", "rendering", "templates", "server-side"]
categories = ["web-programming", "template-engine"]

[lib]
name = "webui"

[features]
cli = ["microsoft-webui-parser/cli"]

[dependencies]
microsoft-webui-parser = { path = "../webui-parser", version = "3.1.1" }
microsoft-webui-protocol = { path = "../webui-protocol", version = "3.1.1", features = ["projection-manifest", "content-identity"] }
microsoft-webui-handler = { path = "../webui-handler", version = "3.1.1", features = ["packs"] }
microsoft-webui-discovery = { path = "../webui-discovery", version = "3.1.1" }
microsoft-webui-tokens = { path = "../webui-tokens", version = "3.1.1" }
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.11.0"
bytes = "1.12.1"
tokio = { version = "1.53.3", features = ["full"] }
memchr = "2.8.3"
crossbeam-queue = "0.3.14"
crc32fast = "1.5.0"
log = "0.4.34"
rayon = "1.12.0"
brotli = { version = "9.1.1", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3.27.0"
criterion = "0.8.2"
serde_json = { version = "1.0.151", features = ["raw_value"] }
tokio = { version = "1.53.3", features = ["full"] }
tokio-stream = "0.1.19"
actix-web = { version = "4.18.2", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "cookies", "http2", "unicode", "compat"] }
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
futures-util = "0.3.33"
libc = "0.2.189"
microsoft-webui-handler = { path = "../webui-handler", version = "3.1.1" }
microsoft-webui-protocol = { path = "../webui-protocol", version = "3.1.1", features = ["projection-manifest"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[[bench]]
name = "contact_book_bench"
harness = false

[[bench]]
name = "streaming_bench"
harness = false

[[bench]]
name = "component_assets_bench"
harness = false

[[bench]]
name = "server_request_bench"
harness = false

[[bench]]
name = "lazy_bench"
harness = false

[[example]]
name = "streaming_resource_bench"
path = "examples/streaming_resource_bench.rs"

[[example]]
name = "streaming_e2e_ttfb_bench"
path = "examples/streaming_e2e_ttfb_bench.rs"

[lints]
clippy.perf = { level = "deny", priority = -1 }
clippy.suspicious = { level = "deny", priority = -1 }
clippy.large_enum_variant = "deny"
clippy.large_stack_arrays = "deny"
clippy.large_futures = "deny"
clippy.needless_collect = "deny"
clippy.redundant_clone = "deny"
clippy.unnecessary_to_owned = "deny"
clippy.inefficient_to_string = "deny"
clippy.manual_memcpy = "deny"
clippy.naive_bytecount = "deny"
clippy.cast_possible_truncation = "deny"
clippy.cast_sign_loss = "deny"
clippy.cast_possible_wrap = "deny"
clippy.rc_buffer = "deny"
clippy.large_types_passed_by_value = "deny"
clippy.vec_box = "deny"
clippy.unnecessary_box_returns = "deny"
rust.unsafe_code = "deny"
