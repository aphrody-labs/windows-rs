[package]
name = "microsoft-webui-press"
version = "3.1.1"
edition = "2021"
rust-version = "1.99.1"
authors = ["Microsoft Edge"]
license = "MIT"
repository = "https://github.com/microsoft/webui"
homepage = "https://microsoft.github.io/webui"
description = "High-performance Static Site Generator powered by WebUI Framework"
default-run = "webui-press"
readme = "README.md"

[lib]
name = "webui_docs"
path = "src/lib.rs"

[[bin]]
name = "webui-press"
path = "src/main.rs"

[dependencies]
microsoft-webui = { path = "../webui", version = "3.1.1", features = ["cli"] }
microsoft-webui-discovery = { path = "../webui-discovery", version = "3.1.1" }
microsoft-webui-handler = { path = "../webui-handler", version = "3.1.1" }
microsoft-webui-parser = { path = "../webui-parser", version = "3.1.1" }
microsoft-webui-tokens = { path = "../webui-tokens", version = "3.1.1" }

# Markdown + syntax highlighting
comrak = { version = "0.55.0", default-features = false }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-onig"] }

# Config + frontmatter
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
serde_yaml = { package = "yaml_serde", version = "0.10.7" }

# CLI
clap = { version = "4.6.3", features = ["derive", "color"] }
console = "0.16.6"
anyhow = "1.0.104"

# Performance
rayon = "1.12.0"

# Utilities
thiserror = "2.0.18"
html-escape = "0.2.15"

# Dev server (`webui-press serve`)
microsoft-webui-dev-server = { path = "../webui-dev-server", version = "3.1.1" }
actix-web = { version = "4.18.2", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "cookies", "http2", "unicode", "compat"] }
tokio = { version = "1.53.3", features = ["full"] }
include_dir = "0.7.4"

[dev-dependencies]
tempfile = "3.27.0"
