[package]
name = "microsoft-webui-desktop"
description = "Configurable native desktop SDK for WebUI applications"
version = "3.1.1"
edition = "2021"
rust-version = "1.99.1"
authors = ["Microsoft Edge"]
license = "MIT"
repository = "https://github.com/microsoft/webui"
homepage = "https://microsoft.github.io/webui"
readme = "README.md"
keywords = ["webui", "desktop", "webview", "ipc", "ssr"]
categories = ["gui", "web-programming"]
include = [
    "/assets/ipc/**",
    "/benches/**",
    "/build.rs",
    "/Cargo.toml",
    "/README.md",
    "/runtime/**",
    "/src/**",
    "/tests/*.rs",
    "/tests/public_api/**",
    "/tests/support/**",
    "/tests/fixtures/*.c",
    "/tests/fixtures/*.js",
    "/tests/fixtures/*.mjs",
    "/tests/fixtures/*.py",
    "/tests/fixtures/*.rs",
    "/tests/fixtures/*.ts",
    "/tests/fixtures/linux-local-server/**",
    "/tests/fixtures/typed-ipc/**",
]

[lib]
name = "webui_desktop"

[[bin]]
name = "webui-desktop"
path = "src/cli/main.rs"
required-features = ["cli"]

[features]
default = []
# Host-only pre-frame native error display; deliberately independent of native.
startup-failure = [
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:windows",
    "objc2-app-kit?/NSAlert",
]
local-server = ["native", "dep:getrandom", "dep:libc", "dep:socket2", "objc2-web-kit?/WKNavigationResponse"]
native-url-activation = ["local-server", "dep:url"]
native-services = ["local-server", "dep:url"]
native-picker = [
    "native-services",
    "objc2-app-kit?/NSOpenPanel",
    "objc2-app-kit?/NSSavePanel",
    "objc2-app-kit?/NSPanel",
    "objc2-app-kit?/block2",
    "windows?/Win32_UI_Shell",
]
native-dialogs = ["native-services", "objc2-app-kit?/NSAlert", "objc2-app-kit?/block2"]
native-capture = [
    "native-services",
    "objc2-app-kit?/NSBitmapImageRep",
    "objc2-app-kit?/NSImageRep",
    "objc2-web-kit?/WKSnapshotConfiguration",
]
native-clipboard = [
    "native-capture",
    "objc2-app-kit?/NSPasteboard",
    "windows?/Win32_System_DataExchange",
]
application-ipc = [
    "dep:base64",
    "dep:libc",
    "dep:socket2",
    "dep:futures-channel",
    "dep:futures-executor",
    "dep:futures-util",
    "dep:getrandom",
    "objc2-foundation?/NSJSONSerialization",
    "objc2-foundation?/NSStream",
    "objc2-web-kit?/WKScriptMessageHandlerWithReply",
    "objc2-web-kit?/WKContentWorld",
]
native = [
    "dep:anyhow",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:objc2-web-kit",
    "dep:block2",
    "dep:webview2-com",
    "dep:windows",
    "dep:windows-core",
    "dep:windows-future",
    "dep:gtk4",
    "dep:webkit6",
]
# Opt-in Windows DWM captions for standard-button overlay windows.
native-dwm-frame = ["native"]
source = ["dep:microsoft-webui", "dep:sha2"]
verified-update = ["dep:sha2"]
packaging = ["dep:libc", "dep:sha2"]
cli = ["native", "source", "dep:clap", "dep:console", "dep:expand-tilde", "dep:microsoft-webui-desktop-build"]

[dependencies]
base64 = { version = "0.22.1", optional = true }
microsoft-webui = { path = "../webui", version = "3.1.1", features = ["cli"], optional = true }
microsoft-webui-handler = { path = "../webui-handler", version = "3.1.1" }
microsoft-webui-protocol = { path = "../webui-protocol", version = "3.1.1" }
microsoft-webui-tokens = { path = "../webui-tokens", version = "3.1.1" }
microsoft-webui-desktop-build = { path = "../webui-desktop-build", version = "3.1.1", optional = true }
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = { version = "0.11.0", optional = true }
thiserror = "2.0.18"
url = { version = "2.5.8", optional = true }
futures-channel = { version = "0.3.34", optional = true }
futures-executor = { version = "0.3.33", features = ["thread-pool"], optional = true }
futures-util = { version = "0.3.33", optional = true }
anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.3", features = ["derive", "color"], optional = true }
console = { version = "0.16.6", optional = true }
expand-tilde = { version = "0.6.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { version = "0.4.3", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"
objc2 = { version = "0.6.4", features = ["exception"], optional = true }
objc2-app-kit = { version = "0.3.2", default-features = false, optional = true, features = ["std", "objc2-core-foundation", "NSApplication", "NSAppearance", "NSButton", "NSColor", "NSControl", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSScreen", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSVisualEffectView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, optional = true, features = ["std", "block2", "NSData", "NSDictionary", "NSDistributedNotificationCenter", "NSURL", "NSURLRequest", "NSURLResponse", "NSString", "NSObject", "NSNotification", "NSOperation", "NSGeometry", "NSValue", "NSTimer", "NSDate", "NSRunLoop", "NSBundle"] }
objc2-web-kit = { version = "0.3.2", default-features = false, optional = true, features = ["std", "objc2-app-kit", "objc2-core-foundation", "block2", "WKURLSchemeHandler", "WKURLSchemeTask", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKFrameInfo", "WKSecurityOrigin", "WKScriptMessage", "WKScriptMessageHandler", "WKUserContentController", "WKUserScript"] }
block2 = { version = "0.6.2", optional = true }

[target.'cfg(windows)'.dependencies]
socket2 = { version = "0.6.5", optional = true }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
webview2-com = { version = "0.39.1", optional = true }
windows = { version = "0.62.2", optional = true, features = ["Foundation", "Graphics", "UI", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Networking_WinSock", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows-core = { version = "0.62.2", optional = true }
windows-future = { version = "0.3.2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2.189", optional = true }
socket2 = { version = "0.6.5", optional = true }
gtk4 = { version = "0.11.3", default-features = false, optional = true, features = ["v4_10"] }
webkit6 = { version = "0.6.1", default-features = false, optional = true, features = ["v2_42"] }

[dev-dependencies]
prost = "0.14.4"
tempfile = "3.27.0"
criterion = "0.8.2"
# This internal test helper follows the workspace version across releases.
microsoft-webui-test-utils = { path = "../webui-test-utils" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
block2 = "0.6.2"
# Only the controlled native acceptance fixture clicks AppKit's OK button.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSActionCell", "NSButtonCell", "NSCell"] }

[[test]]
name = "local_server_api"
path = "tests/public_api/local_server.rs"
required-features = ["local-server"]

[[test]]
name = "ipc_contract"
path = "tests/public_api/ipc.rs"
required-features = ["application-ipc"]

[[test]]
name = "codecs"
path = "tests/codecs.rs"
required-features = ["application-ipc"]

[[test]]
name = "capture_allocations"
path = "tests/capture_allocations.rs"
required-features = ["native-capture"]

[[test]]
name = "windows_portable_package"
path = "tests/windows_portable_package.rs"
required-features = ["source"]

[[test]]
name = "precompiled_package"
path = "tests/precompiled_package.rs"
required-features = ["packaging"]

[[test]]
name = "cli_package_e2e"
path = "tests/cli_package_e2e.rs"
required-features = ["cli"]

[[test]]
name = "linux_local_server"
path = "tests/linux_local_server.rs"
# This real GTK/WebKitGTK fixture is an explicit local-server opt-in. The
# package-local desktop gate's ordinary feature matrix must not auto-discover
# an empty Linux-only test binary on macOS.
required-features = ["local-server"]

[[bench]]
name = "navigation"
harness = false

[[bench]]
name = "macos_response"
harness = false
required-features = ["native"]

[[bench]]
name = "macos_menu"
harness = false
required-features = ["native"]

[[example]]
name = "no-ipc-native"
path = "tests/fixtures/no-ipc-native.rs"
required-features = ["native", "source"]

[[example]]
name = "local-server-smoke"
path = "tests/fixtures/local-server-smoke.rs"
required-features = ["local-server"]

[[example]]
name = "local-url-activation"
path = "tests/fixtures/local-url-activation.rs"
required-features = ["native-url-activation"]

[[example]]
name = "local-server-quit"
path = "tests/fixtures/local-server-quit.rs"
required-features = ["local-server", "application-ipc"]

[[example]]
name = "native-geometry"
path = "tests/fixtures/native-geometry.rs"
required-features = ["native-services"]

[[example]]
name = "native-capture"
path = "tests/fixtures/native-capture.rs"
required-features = ["native-capture"]

[[example]]
name = "native-directory"
path = "tests/fixtures/native-directory.rs"
required-features = ["native-picker"]

[[example]]
name = "startup-failure"
path = "tests/fixtures/startup-failure.rs"
required-features = ["startup-failure"]

[[example]]
name = "native-theme"
path = "tests/fixtures/native-theme.rs"
required-features = ["native-services"]

[[example]]
name = "local-server-ipc"
path = "tests/fixtures/native-ipc/local-server.rs"
required-features = ["native", "local-server", "application-ipc"]

[[example]]
name = "webui-native-ipc-fixture"
path = "tests/fixtures/native-ipc/src/main.rs"
required-features = ["native", "application-ipc"]

[lints]
clippy.perf = { level = "deny", priority = -1 }
clippy.suspicious = { level = "deny", priority = -1 }
clippy.large_enum_variant = "deny"
clippy.large_stack_arrays = "deny"
clippy.large_futures = "deny"
clippy.needless_collect = "deny"
clippy.redundant_clone = "deny"
clippy.unnecessary_to_owned = "deny"
clippy.inefficient_to_string = "deny"
clippy.manual_memcpy = "deny"
clippy.naive_bytecount = "deny"
clippy.cast_possible_truncation = "deny"
clippy.cast_sign_loss = "deny"
clippy.cast_possible_wrap = "deny"
clippy.rc_buffer = "deny"
clippy.large_types_passed_by_value = "deny"
clippy.vec_box = "deny"
clippy.unnecessary_box_returns = "deny"
rust.unsafe_code = "deny"
