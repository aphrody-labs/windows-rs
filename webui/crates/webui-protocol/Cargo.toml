[package]
name = "microsoft-webui-protocol"
description = "Core protocol definitions for WebUI framework"
version = "3.1.1"
edition = "2021"
rust-version = "1.99.1"
authors = ["Microsoft Edge"]
license = "MIT"
repository = "https://github.com/microsoft/webui"
homepage = "https://microsoft.github.io/webui"
readme = "README.md"
keywords = ["webui", "protocol", "protobuf", "binary", "serialization"]
categories = ["encoding", "web-programming"]
exclude = ["build.rs"]

[lib]
name = "webui_protocol"

[features]
# Enable the build-time state-projection manifest contract and validation.
projection-manifest = ["dep:sha2"]
# Build-time artifact identity; runtime-only consumers use the stored identity.
content-identity = ["dep:sha2"]
# Enable to regenerate src/gen_webui.rs from proto/webui.proto via prost-build.
# Off by default so crates.io consumers don't pull in prost-build.
regenerate-proto = ["dep:prost-build"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
thiserror = "2.0.18"
prost = "0.14.4"
sha2 = { version = "0.11.0", optional = true }

[build-dependencies]
prost-build = { version = "0.14.4", optional = true }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "protocol_bench"
harness = false

[lints]
clippy.perf = { level = "deny", priority = -1 }
clippy.suspicious = { level = "deny", priority = -1 }
clippy.large_enum_variant = "deny"
clippy.large_stack_arrays = "deny"
clippy.large_futures = "deny"
clippy.needless_collect = "deny"
clippy.redundant_clone = "deny"
clippy.unnecessary_to_owned = "deny"
clippy.inefficient_to_string = "deny"
clippy.manual_memcpy = "deny"
clippy.naive_bytecount = "deny"
clippy.cast_possible_truncation = "deny"
clippy.cast_sign_loss = "deny"
clippy.cast_possible_wrap = "deny"
clippy.rc_buffer = "deny"
clippy.large_types_passed_by_value = "deny"
clippy.vec_box = "deny"
clippy.unnecessary_box_returns = "deny"
rust.unsafe_code = "deny"
