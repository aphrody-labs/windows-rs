[package]
name = "microsoft-webui-wasm"
description = "WebAssembly bindings for WebUI framework — powers the online playground"
version = "3.1.1"
edition = "2021"
rust-version = "1.99.1"
authors = ["Microsoft Edge"]
license = "MIT"
repository = "https://github.com/microsoft/webui"
homepage = "https://microsoft.github.io/webui"
readme = "README.md"
keywords = ["webui", "wasm", "webassembly", "ssr", "rendering"]
categories = ["wasm", "web-programming"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
name = "webui_wasm"
crate-type = ["cdylib", "rlib"]

[features]
default = ["all"]
all = ["handler", "parser", "microsoft-webui-handler/packs", "dep:serde"]
handler = ["dep:microsoft-webui-handler"]
parser = ["dep:microsoft-webui-parser", "microsoft-webui-protocol/projection-manifest", "microsoft-webui-protocol/content-identity"]

[dependencies]
microsoft-webui-parser = { path = "../webui-parser", version = "3.1.1", default-features = false, optional = true }
microsoft-webui-handler = { path = "../webui-handler", version = "3.1.1", optional = true }
microsoft-webui-protocol = { path = "../webui-protocol", version = "3.1.1" }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", features = ["raw_value"] }
wasm-bindgen = "=0.2.127"
js-sys = "0.3.104"
serde-wasm-bindgen = "0.6.5"
thiserror = "2.0.18"

[lints]
clippy.perf = { level = "deny", priority = -1 }
clippy.suspicious = { level = "deny", priority = -1 }
clippy.large_enum_variant = "deny"
clippy.large_stack_arrays = "deny"
clippy.large_futures = "deny"
clippy.needless_collect = "deny"
clippy.redundant_clone = "deny"
clippy.unnecessary_to_owned = "deny"
clippy.inefficient_to_string = "deny"
clippy.manual_memcpy = "deny"
clippy.naive_bytecount = "deny"
clippy.cast_possible_truncation = "deny"
clippy.cast_sign_loss = "deny"
clippy.cast_possible_wrap = "deny"
clippy.rc_buffer = "deny"
clippy.large_types_passed_by_value = "deny"
clippy.vec_box = "deny"
clippy.unnecessary_box_returns = "deny"
rust.unsafe_code = "deny"
