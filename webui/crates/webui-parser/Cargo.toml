[package]
name = "microsoft-webui-parser"
description = "Core parser for WebUI framework"
version = "3.1.1"
edition = "2021"
rust-version = "1.99.1"
authors = ["Microsoft Edge"]
license = "MIT"
repository = "https://github.com/microsoft/webui"
homepage = "https://microsoft.github.io/webui"
readme = "README.md"
keywords = ["webui", "parser", "html", "templates", "ssr"]
categories = ["parser-implementations", "template-engine", "web-programming"]

[lib]
name = "webui_parser"

[features]
default = ["fs"]
fs = ["walkdir"]
cli = ["clap"]

[package.metadata.cargo-shear]
# `clap` is used only via `cfg_attr(feature = "cli", derive(clap::ValueEnum))`
# attribute macros; cargo-shear doesn't expand macros by default and so
# reports a false positive without `--expand`.
ignored = ["clap"]

[dependencies]
microsoft-webui-protocol = { path = "../webui-protocol", version = "3.1.1" }
microsoft-webui-tokens = { path = "../webui-tokens", version = "3.1.1" }
thiserror = "2.0.18"
html-escape = "0.2.15"
walkdir = { version = "2.5.0", optional = true }
clap = { version = "4.6.3", features = ["derive", "color"], optional = true }
sha2 = "0.11.0"

[dev-dependencies]
microsoft-webui-test-utils = { path = "../webui-test-utils", version = "3.1.1" }
criterion = "0.8.2"

[[bench]]
name = "parser_bench"
harness = false

[[bench]]
name = "fast_parser_bench"
harness = false

[lints]
clippy.perf = { level = "deny", priority = -1 }
clippy.suspicious = { level = "deny", priority = -1 }
clippy.large_enum_variant = "deny"
clippy.large_stack_arrays = "deny"
clippy.large_futures = "deny"
clippy.needless_collect = "deny"
clippy.redundant_clone = "deny"
clippy.unnecessary_to_owned = "deny"
clippy.inefficient_to_string = "deny"
clippy.manual_memcpy = "deny"
clippy.naive_bytecount = "deny"
clippy.cast_possible_truncation = "deny"
clippy.cast_sign_loss = "deny"
clippy.cast_possible_wrap = "deny"
clippy.rc_buffer = "deny"
clippy.large_types_passed_by_value = "deny"
clippy.vec_box = "deny"
clippy.unnecessary_box_returns = "deny"
rust.unsafe_code = "deny"
