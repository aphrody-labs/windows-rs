[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.1"
publish = false

[features]
windows-app-sdk-tools = ["dep:windows-bindgen"]

[dependencies]
console = "0.16.6"
ctrlc = "3.5.2"
serde_json = { version = "1.0.151", features = ["raw_value"] }
windows-bindgen = { version = "=0.65.0", optional = true }
sha2 = "0.11.0"
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
which = "8.0.6"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_StationsAndDesktops", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[lints]
clippy.perf = { level = "deny", priority = -1 }
clippy.suspicious = { level = "deny", priority = -1 }
clippy.large_enum_variant = "deny"
clippy.large_stack_arrays = "deny"
clippy.large_futures = "deny"
clippy.needless_collect = "deny"
clippy.redundant_clone = "deny"
clippy.unnecessary_to_owned = "deny"
clippy.inefficient_to_string = "deny"
clippy.manual_memcpy = "deny"
clippy.naive_bytecount = "deny"
clippy.cast_possible_truncation = "deny"
clippy.cast_sign_loss = "deny"
clippy.cast_possible_wrap = "deny"
clippy.rc_buffer = "deny"
clippy.large_types_passed_by_value = "deny"
clippy.vec_box = "deny"
clippy.unnecessary_box_returns = "deny"
rust.unsafe_code = "deny"
