# Subtrees merged into aphrody-labs/windows-rs, branch nt/monorepo (core of nt).
# Each project: `git fetch --depth=1 <local fork clone> HEAD`, then
# `git subtree add --squash --prefix=<dir> <commit>`; `squash` is the resulting squash commit.
# Layout: one top-level directory per project, named after the repository in lowercase.
# Update: `git subtree pull --squash --prefix=<dir> <fork> <ref>`, then re-inline the
# workspace inheritance of joined projects from <dir>/Cargo.upstream.toml (see [workspace]).

[base]
repo = "https://github.com/aphrody-labs/windows-rs"
upstream = "https://github.com/microsoft/windows-rs"
commit = "8ca69fdaa9d69c78b9bcfbee96c6916f2282e7f0"
commit-date = "2026-11-11T08:54:26-06:00"
imported = "2026-11-12"

[workspace]
# `cargo metadata --format-version 1` at the root, 2026-11-12: 324 members, 1040 packages,
# with cargo 1.102.0-nightly (2026-11-06) and cargo 1.99.1 stable. No compilation.
joined = ["diskann", "edit", "litebox", "mxc", "sudo", "webui", "windows-drivers-rs"]
excluded = ["nvx", "openvmm", "windows-rust-driver-samples"]
joined-changes = [
  "<dir>/Cargo.toml (the upstream workspace root) renamed <dir>/Cargo.upstream.toml",
  "member manifests: `*.workspace = true` and `[lints] workspace = true` inlined with cargo's effective inherited values (paths rebased)",
  "root Cargo.toml: members and upstream excludes prefixed with <dir>/; default-members = windows-rs globs",
]
joined-caveats = [
  "built-in profiles of joined projects ([profile.dev/release/test/bench]) are ignored: the windows-rs root owns them (release: lto thin, strip debuginfo)",
  "per-project Cargo.lock files are no longer used; the root lock is untracked (windows-rs .gitignore: *.lock)",
  "<dir>/.cargo/config.toml and <dir>/rust-toolchain.toml only apply when cargo runs from inside <dir>",
  "windows-rs CI `cargo test --all` (test.yml), `cargo clippy --workspace` (clippy.yml), `cargo fmt --all` (fmt.yml) now span joined crates; these workflows run on master pushes and PRs only",
]
# Not carried from nt (the nt crates dwm/* were dropped from scope by the owner on 2026-11-12):
# no root rust-toolchain.toml (nightly-2026-11-11 would override the stable/1.95/nightly
# toolchains that windows-rs CI selects with `rustup default`); no nt profiles (release lto fat,
# wasm) or .cargo/release*.toml: they would replace windows-rs [profile.release].

[project.windows-drivers-rs]
upstream = "https://github.com/microsoft/windows-drivers-rs"
fork = "https://github.com/aphrody-labs/windows-drivers-rs"
branch = "main"
commit = "9e1d8a368811d8119a2773c473c93839a96ade23"
commit-date = "2026-11-05T00:32:44Z"
squash = "28c25eb57a3d8fe5dbceecfbfb3a9e0fce5ccc76"
workspace = "joined: crates/* (7 members)"
notes = ["examples/ and tests/ stay excluded as upstream: one WDK driver config per build graph", "the root has no [workspace.metadata.wdk], like the upstream root"]

[project.windows-rust-driver-samples]
upstream = "https://github.com/microsoft/Windows-rust-driver-samples"
fork = "https://github.com/aphrody-labs/Windows-rust-driver-samples"
branch = "main"
commit = "0badf9127c172ad00bb674bef9786942b3eddf0f"
commit-date = "2026-11-04T15:37:00+05:30"
squash = "02eb35944ce4d140c519de10863bef7617b9fef8"
workspace = "excluded (resolves on its own: 3 members, 110 packages, --locked)"
blockers = [
