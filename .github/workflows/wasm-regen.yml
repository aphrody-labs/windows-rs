# Temporary: regenerates the code that `windows-bindgen` writes so the `nt/wasm` branch can
# commit it without building locally. Removed once the regenerated code is committed.
name: wasm-regen

permissions:
  contents: read

on:
  push:
    branches:
      - 'nt/wasm'

jobs:
  regen:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update toolchain
        run: rustup update --no-self-update stable && rustup default stable
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Add toolchain targets
        run: rustup target add i686-pc-windows-msvc x86_64-pc-windows-msvc aarch64-pc-windows-msvc
      - name: Fix environment
        uses: ./.github/actions/fix-environment
        with:
          target: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm-regen
      - name: tool-bindings
        run: cargo run -p tool-bindings --release
      - name: tool-package
        run: cargo run -p tool-package --release
      - name: test_bindgen fixtures
        continue-on-error: true
        run: cargo test -p test_bindgen --test bindgen
      - name: test_win32_metadata fixtures
        continue-on-error: true
        run: cargo test -p test_win32_metadata --test win32
      - name: Diff
        shell: bash
        run: |
          git add -N .
          git diff --stat | tail -5
          git diff --binary > regen.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regen
          path: regen.patch
