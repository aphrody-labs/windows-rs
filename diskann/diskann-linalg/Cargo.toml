[package]
name = "diskann-linalg"
version = "0.62.0"
description = "DiskANN3 is a composable library for bringing scalable, accurate and cost-effective vector indexing to multiple databases."
authors = ["Microsoft"]
repository = "https://github.com/microsoft/DiskANN"
license = "MIT"
edition = "2021"

[dependencies]
faer = { version = "0.23", default-features = false, features = ["std"]}
cfg-if = "1.0.0"
thiserror = "2.0.12"
rand_distr = "0.5"
rand = "0.9.3"

[lints]
clippy.allow_attributes = "warn"
clippy.undocumented_unsafe_blocks = "warn"
clippy.uninlined_format_args = "allow"

[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.142"
approx = "0.5.1"
