[package]
name = "diskann-disk"
version = "0.62.0"
description = "DiskANN3 is a composable library for bringing scalable, accurate and cost-effective vector indexing to multiple databases."
authors = ["Microsoft"]
repository = "https://github.com/microsoft/DiskANN"
license = "MIT"
edition = "2024"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
]

[dependencies]
# Core dependencies
diskann = { path = "../diskann", version = "0.62.0" }
diskann-utils = { path = "../diskann-utils", default-features = false, version = "0.62.0" }
diskann-providers = { path = "../diskann-providers", default-features = false, version = "0.62.0" }
diskann-vector = { path = "../diskann-vector", version = "0.62.0" }
diskann-linalg = { path = "../diskann-linalg", version = "0.62.0" }
diskann-quantization = { path = "../diskann-quantization", default-features = false, version = "0.62.0", features = ["rayon"] }

# Shared dependencies from main diskann crate
anyhow = "1.0.98"
bincode = "1.3.3"
bytemuck = "1.23.0"
byteorder = "1.5.0"
cfg-if = "1.0.0"
futures-util = { version = "0.3.31", default-features = false }
hashbrown = "0.16.0"
half = { version = "2.6.0", features = ["bytemuck", "num-traits"] }
rand = "0.9.3"
rayon = "1.10.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.12"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.40"
vfs = "0.12.1"

# Optional dependencies
opentelemetry = { version = "0.32.0", optional = true }
diskann-inmem = { path = "../diskann-inmem", default-features = false, version = "0.62.0", features = ["quantization"] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.6.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2.148"

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation"
]

[dev-dependencies]
rstest = "0.23.0"
tempfile = "3.20.0"
vfs = "0.12.1"
diskann-providers = { path = "../diskann-providers", default-features = false, version = "0.62.0", features = ["testing", "virtual_storage"] }
diskann-utils = { path = "../diskann-utils", default-features = false, version = "0.62.0", features = ["testing"] }
criterion = "0.5.1"
gungraun = "0.20.0"
diskann = { path = "../diskann", version = "0.62.0" }
approx = "0.5.1"
proptest = "1.6.0"

[features]
default = []
perf_test = ["dep:opentelemetry"]
experimental_diversity_search = [
    "diskann/experimental_diversity_search",
    "diskann-providers/experimental_diversity_search",
]

[[bench]]
name = "bench_main"
harness = false

[[bench]]
name = "bench_main_gungraun"
harness = false

# Some 'cfg's in the source tree will be flagged by `cargo clippy -j 2 --workspace --no-deps --all-targets -- -D warnings`
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lints.clippy]
allow_attributes = "warn"
