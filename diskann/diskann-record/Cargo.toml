[package]
name = "diskann-record"
version = "0.62.0"
description = "DiskANN3 is a composable library for bringing scalable, accurate and cost-effective vector indexing to multiple databases."
authors = ["Microsoft"]
repository = "https://github.com/microsoft/DiskANN"
license = "MIT"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.142", optional = true }

[features]
default = ["disk"]
serde = ["dep:serde"]
disk = ["serde", "dep:serde_json"]

[dev-dependencies]
tempfile = "3.20.0"

[lints]
clippy.allow_attributes = "warn"
clippy.undocumented_unsafe_blocks = "warn"
