[package]
name = "diskann-quantization"
version = "0.62.0"
description = "DiskANN3 is a composable library for bringing scalable, accurate and cost-effective vector indexing to multiple databases."
authors = ["Microsoft"]
repository = "https://github.com/microsoft/DiskANN"
license = "MIT"
edition = "2024"

[dependencies]
bytemuck = { version = "1.23.0", features = ["derive"] }
cfg-if = "1.0.0"
rand = "0.9.3"
thiserror = "2.0.12"
diskann-vector = { path = "../diskann-vector", version = "0.62.0" }
diskann-wide = { path = "../diskann-wide", version = "0.62.0" }
diskann-linalg = { path = "../diskann-linalg", version = "0.62.0", optional = true }
rayon = { version = "1.10.0", optional = true }
flatbuffers = { version = "25.2.10", optional = true }
half = { version = "2.6.0", features = ["bytemuck"] }
diskann-utils = { path = "../diskann-utils", default-features = false, version = "0.62.0" }

# Detect L1/L2 cache sizes to size matrix-kernel tile budgets.
[target.'cfg(any(all(target_arch = "x86", not(target_env = "sgx"), target_feature = "sse"), all(target_arch = "x86_64", not(target_env = "sgx"))))'.dependencies]
raw-cpuid = "11.5"
[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2.148"
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_SystemInformation"] }

[lints.clippy]
allow_attributes = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
uninlined_format_args = "allow"

[dev-dependencies]
diskann-utils = { path = "../diskann-utils", default-features = false, version = "0.62.0", features = ["testing"] }
cfg-if = "1.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.142"
trybuild = "1.0.120"
rand_distr = "0.5"

[[bin]]
name = "detect-cache"
path = "detect-cache/main.rs"
required-features = ["cache-diagnostics"]

[features]
default = ["rayon"]

# Expose cache internals to the detect-cache binary.
cache-diagnostics = []

# Add support for linear-algebran enhanced routines.
linalg = ["dep:diskann-linalg"]

# Compile support for serializing and deserializing to flatbuffers.
flatbuffers = ["dep:flatbuffers"]

# Enable Rayon-based Parallelism for tagged kernels.
rayon = ["dep:rayon", "diskann-utils/rayon"]

# Instantiate well named functions for distance functions whose aseembly we care about.
#
# This adds to the compile time of the library without meaningfully adding features to the
# library and is meant to help with tooling.
codegen = []

# Note
#
# Build docs locally with
# ```
# RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc \
#    --package quantization \
#    --features rayon,linalg,flatbuffers \
#    --no-deps
# ```
[package.metadata.docs.rs]
features = ["rayon", "linalg", "flatbuffers"]
rustdoc-args = ["--cfg", "docsrs"]
