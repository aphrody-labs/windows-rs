[package]
name = "diskann"
version = "0.62.0"
description = "DiskANN3 is a composable library for bringing scalable, accurate and cost-effective vector indexing to multiple databases."
authors = ["Microsoft"]
repository = "https://github.com/microsoft/DiskANN"
license = "MIT"
edition = "2024"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-unknown-linux-gnu", "aarch64-pc-windows-msvc", "x86_64-pc-windows-msvc"]

[dependencies]
anyhow = "1.0.98"
bytemuck = { version = "1.23.0", features = ["must_cast"] }
diskann-utils = { path = "../diskann-utils", default-features = false, version = "0.62.0" }
futures-util = { version = "0.3.31", default-features = false }
half = { version = "2.6.0", features = ["bytemuck", "num-traits"] }
# Note: hashbrown not using workspace because diskann needs default-features = false
# while other crates use default-features = true. Keeping version 0.16.0 consistent.
hashbrown = { version = "0.16.0", default-features = false, features = ["default-hasher"] }
num-traits = "0.2.15"
rand = "0.9.3"
rayon = { version = "1.10.0", optional = true }
thiserror = "2.0.12"
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread"] }
tracing = { version = "0.1.40", optional = true }
diskann-vector = { path = "../diskann-vector", version = "0.62.0" }
diskann-wide = { path = "../diskann-wide", version = "0.62.0" }

# Optional Dependencies
dashmap = { version = "6.1.0", optional = true }
diskann-linalg = { path = "../diskann-linalg", version = "0.62.0", optional = true }

[dev-dependencies]
diskann-utils = { path = "../diskann-utils", default-features = false, version = "0.62.0", features = ["testing"] }
futures-util = { version = "0.3.31", default-features = false }
pin-project = "1.1.8"
rand = "0.9.3"
relative-path = "2.0.1"
rstest = "0.23.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.142"
tokio = { version = "1.48.0", features = ["macros", "sync"] }
dashmap = "6.1.0"

# Some 'cfg's in the source tree will be flagged by `cargo clippy -j 2 --workspace --no-deps --all-targets -- -D warnings`
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lints.clippy]
allow_attributes = "warn"
# Commenting out for now. It would give warnings.
# undocumented_unsafe_blocks = "warn"
uninlined_format_args = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[features]
default = ["tracing"]

# Enable PiPNN batch graph construction.
pipnn = ["dep:diskann-linalg", "dep:rayon", "diskann-utils/rayon"]

# Enable "tracing" diagnostics.
tracing = ["dep:tracing"]

# Enable testing providers.
testing = ["dep:dashmap"]

# Enable experimental diversity search
experimental_diversity_search = []
