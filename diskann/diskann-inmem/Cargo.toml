[package]
name = "diskann-inmem"
version = "0.62.0"
description = "DiskANN3 is a composable library for bringing scalable, accurate and cost-effective vector indexing to multiple databases."
authors = ["Microsoft"]
repository = "https://github.com/microsoft/DiskANN"
license = "MIT"
edition = "2024"

[dependencies]
bytemuck = { version = "1.23.0", features = ["must_cast"] }
crossbeam-queue = { version = "0.3.12", default-features = false, features = ["alloc"] }
crossbeam-utils = { version = "0.8.23", default-features = false }
dashmap = "6.1.0"
diskann = { path = "../diskann", version = "0.62.0" }
diskann-utils = { path = "../diskann-utils", default-features = false, version = "0.62.0" }
diskann-vector = { path = "../diskann-vector", version = "0.62.0" }
diskann-wide = { path = "../diskann-wide", version = "0.62.0" }
parking_lot = "0.12.5"
half = "2.6.0"
hashbrown = "0.16.0"
thiserror = "2.0.12"

# Optional
diskann-quantization = { path = "../diskann-quantization", default-features = false, version = "0.62.0", optional = true }

# Integration Test Dependencies
diskann-benchmark-runner = { path = "../diskann-benchmark-runner", version = "0.62.0", optional = true, features = ["ux-tools"] }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.142", optional = true }
anyhow = { version = "1.0.98", optional = true }
rand = { version = "0.9.3", optional = true }
diskann-benchmark-core = { path = "../diskann-benchmark-core", version = "0.62.0", optional = true }
tokio = { version = "1.48.0", optional = true }

[lints.rust]
# Some longer-running integration tests are skipped when running code coverage by using
# `cfg(coverage)`. This prevents us from getting warnings for the `coverage` condition,
# which is added by `llvm-cov` but is otherwise not a standard condition name.
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(coverage)'] }

[lints.clippy]
allow_attributes = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
uninlined_format_args = "allow"

[dev-dependencies]
diskann-utils = { path = "../diskann-utils", default-features = false, version = "0.62.0", features = ["testing"] }
diskann = { path = "../diskann", version = "0.62.0", features = ["testing"] }
rand = "0.9.3"
tokio = { version = "1.48.0", features = ["macros"] }
tempfile = "3.20.0"

[[bin]]
name = "integration-test"
path = "integration/main.rs"
required-features = [
    "integration-test",
    "quantization",
]

[features]
default = []

# Enable spherical-quantization
quantization = [
    "dep:diskann-quantization",
]

# Enable stress test module
integration-test = [
    "dep:diskann-benchmark-runner",
    "dep:diskann-benchmark-core",
    "dep:tokio",
    "dep:serde",
    "dep:serde_json",
    "dep:anyhow",
    "dep:rand",
    "diskann-utils/testing",
]

# Note
#
# Build docs locally with
# ```
# RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc \
#    --package diskann-inmem \
#    --features quantization \
#    --no-deps \
#    --features quantization
# ```
[package.metadata.docs.rs]
features = ["quantization"]
rustdoc-args = ["--cfg", "docsrs"]
