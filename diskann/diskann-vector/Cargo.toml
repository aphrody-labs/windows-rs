[package]
name = "diskann-vector"
edition = "2021"
version = "0.62.0"
authors = ["Microsoft"]
description = "DiskANN3 is a composable library for bringing scalable, accurate and cost-effective vector indexing to multiple databases."
repository = "https://github.com/microsoft/DiskANN"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cfg-if = "1.0.0"
half = "2.6.0"
diskann-wide = { path = "../diskann-wide", version = "0.62.0" }

[dev-dependencies]
approx = "0.5.1"
gungraun = "0.20.0"
rand = "0.9.3"
criterion = "0.5.1"
rand_distr = "0.5"
half = { version = "2.6.0", features = ["rand_distr", "num-traits", "bytemuck"] }
bytemuck = { version = "1.23.0", features = ["must_cast"] }

[[bench]]
name = "bench_main"
harness = false

[[bench]]
name = "bench_main_vector_gungraun"
harness = false

[lints]
clippy.allow_attributes = "warn"
# Commenting out for now. It would give warnings.
# clippy.undocumented_unsafe_blocks = "warn"
clippy.uninlined_format_args = "allow"
