[package]
name = "diskann-benchmark-runner"
version = "0.62.0"
description = "DiskANN3 is a composable library for bringing scalable, accurate and cost-effective vector indexing to multiple databases."
authors = ["Microsoft"]
repository = "https://github.com/microsoft/DiskANN"
license = "MIT"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.45", features = ["derive"] }
erased-serde = "0.4.11"
half = "2.6.0"
indicatif = "0.18.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.142"
thiserror = "2.0.12"

[lints.clippy]
allow_attributes = "warn"
undocumented_unsafe_blocks = "warn"
uninlined_format_args = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[dev-dependencies]
diskann-utils = { path = "../diskann-utils", default-features = false, version = "0.62.0", features = ["testing"] }
tempfile = "3.20.0"

[features]
default = []

# Enable building the test executable.
test-app = []

# Expose internal utilities for performing UX error message normalization.
ux-tools = []

[[bin]]
name = "dev"
path = "dev/main.rs"
required-features = ["test-app"]
