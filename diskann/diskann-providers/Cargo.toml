[package]
name = "diskann-providers"
version = "0.62.0"
authors = ["Microsoft"]
description = "DiskANN3 is a composable library for bringing scalable, accurate and cost-effective vector indexing to multiple databases."
repository = "https://github.com/microsoft/DiskANN"
license = "MIT"
edition = "2024"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bincode = "1.3.3"
bytemuck = { version = "1.23.0", features = ["must_cast"] }
byteorder = "1.5.0"
half = { version = "2.6.0", features = ["bytemuck", "num-traits"] }
hashbrown = "0.16.0"
num-traits = "0.2.15"
rand = "0.9.3"
rayon = "1.10.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.12"
diskann-vector = { path = "../diskann-vector", version = "0.62.0" }
rand_distr = "0.5"
cfg-if = "1.0.0"
diskann-wide = { path = "../diskann-wide", version = "0.62.0" }
arc-swap = "1.7.1"
tracing = "0.1.40"
diskann = { path = "../diskann", version = "0.62.0" }
diskann-utils = { path = "../diskann-utils", default-features = false, version = "0.62.0" }
diskann-quantization = { path = "../diskann-quantization", default-features = false, version = "0.62.0", features = ["rayon"] }
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread"] }
tempfile = { version = "3.20.0", optional = true }
prost = "0.14.1"
futures-util = { version = "0.3.31", default-features = false, features = ["async-await"] }
vfs = { version = "0.12.1", optional = true }

[dev-dependencies]
approx = "0.5.1"
diskann = { path = "../diskann", version = "0.62.0", features = ["testing"] }
diskann-utils = { path = "../diskann-utils", default-features = false, version = "0.62.0", features = ["testing"] }
itertools = "0.13.0"
tempfile = "3.20.0"
rstest = "0.23.0"
tokio = { version = "1.48.0", features = ["full"] }
proptest = "1.6.0"
vfs = "0.12.1"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
]

[features]
default = []
testing = ["dep:tempfile"]
experimental_diversity_search = ["diskann/experimental_diversity_search"]
virtual_storage = ["dep:vfs"]

# Some 'cfg's in the source tree will be flagged by `cargo clippy -j 2 --workspace --no-deps --all-targets -- -D warnings`
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lints.clippy]
allow_attributes = "warn"
# Commenting out for now. It would give warnings.
# undocumented_unsafe_blocks = "warn"
uninlined_format_args = "allow"

