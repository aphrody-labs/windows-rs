[package]
name = "diskann-garnet"
version = "9.0.0"
edition = "2024"
authors = ["Microsoft"]
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[lints.clippy]
allow_attributes = "warn"

[dependencies]
bytemuck = "1.23.0"
crossbeam = "0.8.4"
dashmap = { version = "6.1.0", features = ["inline"] }
diskann = { path = "../diskann", version = "0.62.0" }
diskann-quantization = { path = "../diskann-quantization", default-features = false, version = "0.62.0", features = ["flatbuffers"] }
diskann-providers = { path = "../diskann-providers", default-features = false, version = "0.62.0" }
diskann-utils = { path = "../diskann-utils", default-features = false, version = "0.62.0" }
diskann-vector = { path = "../diskann-vector", version = "0.62.0" }
foldhash = "0.2.0"
parking_lot = "0.12.5"
rand = "0.9.3"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.12"
tokio = { version = "1.48.0", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["sync", "rt", "macros"] }
