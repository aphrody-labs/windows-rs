[package]
name = "diskann-utils"
version = "0.62.0"
description = "DiskANN3 is a composable library for bringing scalable, accurate and cost-effective vector indexing to multiple databases."
authors = ["Microsoft"]
repository = "https://github.com/microsoft/DiskANN"
license = "MIT"
edition = "2021"

[dependencies]
half = { version = "2.6.0", features = ["rand_distr", "num-traits"] }
cfg-if = "1.0.0"
rayon = { version = "1.10.0", optional = true }
thiserror = "2.0.12"
diskann-vector = { path = "../diskann-vector", version = "0.62.0" }
rand = "0.9.3"
rand_distr = "0.5"
diskann-wide = { path = "../diskann-wide", version = "0.62.0" }
bytemuck = { version = "1.23.0", features = ["must_cast"] }

[lints]
clippy.allow_attributes = "warn"
clippy.undocumented_unsafe_blocks = "warn"

# [lints.clippy]
# undocumented_unsafe_blocks = "warn"
# unwrap_used = "warn"
# expect_used = "warn"
# panic = "warn"
# uninlined_format_args = "allow"

[dev-dependencies]
cfg-if = "1.0.0"
rand = "0.9.3"
rstest = "0.23.0"


[features]
default = ["rayon"]

# Enable Rayon-based Parallelism for tagged kernels.
rayon = ["dep:rayon"]

# Enable testing utilities like test_data_root()
testing = []
