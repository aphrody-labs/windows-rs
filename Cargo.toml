[workspace]
resolver = "3"
members = [
    "crates/libs/*",
    "crates/tools/*",
    "crates/samples/*/*",
    "crates/tests/interop",
    "crates/tests/libs/*",
    "crates/tests/misc/*",
    # Imported subtrees joined to this workspace: see MERGED.toml [project.*].workspace
    "diskann/diskann-wide",
    "diskann/diskann-vector",
    "diskann/diskann-linalg",
    "diskann/diskann-utils",
    "diskann/diskann-quantization",
    "diskann/diskann",
    "diskann/diskann-providers",
    "diskann/diskann-disk",
    "diskann/diskann-label-filter",
    "diskann/diskann-garnet",
    "diskann/diskann-inmem",
    "diskann/diskann-benchmark-runner",
    "diskann/diskann-benchmark-core",
    "diskann/diskann-benchmark-simd",
    "diskann/diskann-benchmark",
    "diskann/diskann-record",
    "diskann/diskann-tools",
    "diskann/diskann-bftree",
    "edit/crates/*",
    "litebox/litebox",
    "litebox/litebox_common_linux",
    "litebox/litebox_common_optee",
    "litebox/litebox_common_lvbs",
    "litebox/litebox_platform_linux_kernel",
    "litebox/litebox_platform_linux_userland",
    "litebox/litebox_platform_windows_userland",
    "litebox/litebox_platform_lvbs",
    "litebox/litebox_runner_linux_userland",
    "litebox/litebox_runner_linux_on_windows_userland",
    "litebox/litebox_runner_lvbs",
    "litebox/litebox_runner_optee_on_linux_userland",
    "litebox/litebox_shim_linux",
    "litebox/litebox_shim_optee",
    "litebox/litebox_service_heki",
    "litebox/litebox_syscall_rewriter",
    "litebox/litebox_packager",
    "litebox/litebox_runner_snp",
    "litebox/litebox_util_log",
    "litebox/litebox_util_log_macros",
    "litebox/dev_tests",
    "litebox/dev_bench",
    "mxc/samples/dryrun-check-containment-support/rust",
    "mxc/samples/run-in-persisted-container/rust",
    "mxc/samples/run-in-transient-container/rust",
    "mxc/samples/run-with-containment-of-filesystem/rust",
    "mxc/samples/run-with-containment-of-network/rust",
    "mxc/samples/run-with-logging-access-denied/rust",
    "mxc/samples/run-with-io-captured/rust",
    "mxc/samples/run-with-io-pty-interactive/rust",
    "mxc/samples/run-with-io-stdio-streaming/rust",
    "mxc/samples/run-with-telemetry/rust",
    "mxc/src/mxc-sdk",
    "mxc/src/ffi/mxc_ffi",
    "mxc/src/testing/unix_test_proxy",
    "mxc/src/testing/wxc_test_driver",
    "mxc/src/testing/wxc_test_proxy",
    "mxc/src/testing/wxc_ui_probe",
    "mxc/src/tools/lxc",
    "mxc/src/tools/mxc_darwin",
    "mxc/src/tools/mxc_diagnostic_console",
    "mxc/src/tools/mxc_schema_gen",
    "mxc/src/tools/wxc",
    "sudo/sudo",
    "sudo/sudo_events",
    "sudo/win32resources",
    "webui/crates/*",
    "webui/xtask",
    "windows-drivers-rs/crates/*",
]
# A bare `cargo build`/`cargo test` at the root keeps building windows-rs only.
default-members = [
    "crates/libs/*",
    "crates/tools/*",
    "crates/samples/*/*",
    "crates/tests/interop",
    "crates/tests/libs/*",
    "crates/tests/misc/*",
]
exclude = [
    # Imported subtrees that stay separate workspaces: see MERGED.toml [project.*].blockers
    "nvx",
    "openvmm",
    "windows-rust-driver-samples",
    # Upstream exclusions of the joined subtrees
    "diskann/rfcs",
    "diskann/vectorset",
    "mxc/src/testing/fuzz",
    "windows-drivers-rs/examples/sample-kmdf-driver",
    "windows-drivers-rs/examples/sample-umdf-driver",
    "windows-drivers-rs/examples/sample-wdm-driver",
    "windows-drivers-rs/tests/config-kmdf",
    "windows-drivers-rs/tests/config-umdf",
    "windows-drivers-rs/tests/config-wdm",
    "windows-drivers-rs/tests/wdk-macros-tests",
    "windows-drivers-rs/tests/wdk-sys-tests",
]

[profile.release]
lto = "thin"
strip = "debuginfo"

[profile.profiling]
inherits = "release"
debug = 1
strip = "none"


[profile.dev.package."*"]
opt-level = 2

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(windows_slim_errors, windows_cast_diagnostics)'] }
missing_unsafe_on_extern = "warn"
unused_qualifications = "warn"

[workspace.lints.cargo]
unused_dependencies = "deny"

[workspace.lints.clippy]
self_named_module_files = "warn"
type_complexity = "allow"
manual_c_str_literals = "allow" # windows-bindgen needs to switch to signed char for this to work
try_from_instead_of_from_str = "allow" # `GUID: TryFrom<&str>` is public API; switching to `FromStr` is a breaking change
semicolon_if_nothing_returned = "warn"
map_unwrap_or = "warn"
manual_let_else = "warn"
uninlined_format_args = "warn"
redundant_clone = "warn"
implicit_clone = "warn"
single_match_else = "warn"
cloned_instead_of_copied = "warn"
manual_string_new = "warn"
manual_assert = "warn"
assigning_clones = "warn"
explicit_iter_loop = "warn"
use_self = "warn"

[workspace.dependencies]
helpers = { path = "crates/tools/helpers" }
proc-macro2 = { version = "1.0", default-features = false }
quote = { version = "1.0", default-features = false }
serde = { version = "1.0", default-features = false }
syn = { version = "2.0", default-features = false }
# generated dependencies
cppwinrt = { version = "0.100.1", path = "crates/libs/cppwinrt", default-features = false }
windows = { version = "0.100.0", path = "crates/libs/windows", default-features = false }
