[package]
name = "mxc_schema_gen"
publish = false
version = "1.0.1"
edition = "2021"

# Emits exact versioned MXC config schemas and TypeScript wire oracles.
[dependencies]
clap = { version = "4", features = ["derive"] }
mxc-sdk = { path = "../../mxc-sdk", features = ["schema-gen"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
tempfile = "3"
