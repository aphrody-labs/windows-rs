[package]
name = "lxc"
publish = false
version = "1.0.1"
edition = "2021"
license = "MIT"

[[bin]]
name = "lxc-exec"
path = "src/main.rs"

[features]
hyperlight = ["mxc-sdk/hyperlight"]
microvm = ["mxc-sdk/microvm"]

[dependencies]
mxc-sdk = { path = "../../mxc-sdk" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[target.'cfg(windows)'.build-dependencies]
cc = "1"
winresource = { version = "0.1.31", default-features = false }
