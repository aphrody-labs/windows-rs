[package]
name = "mxc_darwin"
publish = false
version = "1.0.1"
edition = "2021"
license = "MIT"

[[bin]]
name = "mxc-exec-mac"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
mxc-sdk = { path = "../../mxc-sdk" }
serde_json = { version = "1", features = ["raw_value"] }

[target.'cfg(windows)'.build-dependencies]
cc = "1"
winresource = { version = "0.1.31", default-features = false }
