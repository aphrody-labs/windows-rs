[package]
name = "unix_test_proxy"
publish = false
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "unix-test-proxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
